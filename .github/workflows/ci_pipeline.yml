---
name: CI Pipeline

"on":
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/ci_pipeline.yml
      - copier_template_tester/**
      - tests/**
      - uv.lock
      - pyproject.toml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run static linters
        run: uv run calcipy-lint lint.check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test
        run: uv run calcipy-test test.pytest

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run typecheck
        run: uv run calcipy-types types.mypy

      # pyright-action requires Python to be in PATH explicitly
      # Based on: https://github.com/jakebailey/pyright-action/issues/10#issuecomment-1455220629
      - name: Add uv Python to Path
        run: echo "$(uv run python -c 'import sys; print(sys.prefix)')/bin" >> "$GITHUB_PATH"
      - uses: jakebailey/pyright-action@8ec14b5cfe41f26e5f41686a31eb6012758217ef # v3.0.2
